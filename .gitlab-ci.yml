stages:
  - build
  - deploy
  - update 

update:
  stage: update
  image: archlinux:latest
  rules:
    - when: always
  before_script:
    - pacman -Sy --noconfirm rclone gnupg binutils tar
    
    - mkdir -p ~/.config/rclone
    - |
      cat <<EOF > ~/.config/rclone/rclone.conf
      [r2]
      type = s3
      provider = Cloudflare
      access_key_id = $R2_ACCESS_KEY
      secret_access_key = $R2_SECRET_KEY
      endpoint = $R2_ENDPOINT
      acl = private
      EOF
      
    - echo "$GPG_PRIVATE_KEY" | base64 -d > private.key
    - gpg --import --batch --yes private.key
    
  script:
    - touch empty_file
    - echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign empty_file
    
    - rclone copy r2:$R2_BUCKET/x86_64/ . --include "bakery-os.db*" --include "*.pkg.tar.zst*"
      
    # - |
    #   if [ -n "$NEW_PACKAGES" ]; then
    #     IFS=',' read -ra ADDR <<< "$NEW_PACKAGES"
    #     for pkg in "${ADDR[@]}"; do
    #       echo "Downloading new package: $pkg"
    #       rclone copy r2:$R2_BUCKET/x86_64/$pkg .
          
    #       echo "Downloading new package signature: $pkg.sig"
    #       rclone copy r2:$R2_BUCKET/x86_64/$pkg.sig . || echo "Signature not found! SKIPPED"
    #     done
    #   else
    #     echo "No new packages provided. Re-indexing existing repository."
    #   fi

    - repo-add bakery-os.db.tar.gz *.pkg.tar.zst
    - mv bakery-os.db.tar.gz bakery-os.db
      
    - echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign bakery-os.db
    - echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor bakery-os.db

    - rclone copy . r2:$R2_BUCKET/x86_64 --include "bakery-os.db*" --include "*.pkg.tar.zst*"