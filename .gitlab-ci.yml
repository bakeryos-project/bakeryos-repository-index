stages:
  - build
  - deploy
  - update 

update:
  stage: update
  image: archlinux:latest
  rules:
    - when: always
  before_script:
    - pacman -Sy --noconfirm rclone gnupg binutils tar
    
    - mkdir -p ~/.config/rclone
    - |
      cat <<EOF > ~/.config/rclone/rclone.conf
      [r2]
      type = s3
      provider = Cloudflare
      access_key_id = $R2_ACCESS_KEY
      secret_access_key = $R2_SECRET_KEY
      endpoint = $R2_ENDPOINT
      EOF
      
    - echo "$GPG_PRIVATE_KEY" | base64 -d > private.key
    - gpg --import --batch --yes private.key
    
  script:
    - rclone copy r2:$R2_BUCKET/x86_64/ .
    - repo-add --sign --key "$GPG_KEY_ID" bakery-os.db.tar.gz *.pkg.tar.zst
    
    - cp bakery-os.db.tar.gz bakery-os.db
    - cp bakery-os.db.tar.gz.sig bakery-os.db.sig
    
    - echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor bakery-os.db
    
    - rclone copyto bakery-os.db r2:$R2_BUCKET/x86_64/bakery-os.db
    - rclone copyto bakery-os.db.sig r2:$R2_BUCKET/x86_64/bakery-os.db.sig
    - rclone copyto bakery-os.db.asc r2:$R2_BUCKET/x86_64/bakery-os.db.asc